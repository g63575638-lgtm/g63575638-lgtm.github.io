  }
}

// ============================================================================
// CLUB–BALL IMPACT: oblique impact of a lofted face on a free ball.
//  normal:  u_n = v_n (1+e) M_eff / (M_eff + m)
//  tangent: ball rolls up the face -> u_t = 2/7 v_t, spin w = 5/(2r) u_t x n
//  off-centre hits reduce effective mass and add gear-effect spin.
// ============================================================================
const ClubImpact = {
  compute(club, headVel, face0W, upW, soleW, offCenter, vertOff, lie, opts = {}) {
    // orient face toward travel (makes the model robust to handedness)
    let f0 = face0W.slice(); if (V3.dot(f0, headVel) < 0) V3.scale(f0, f0, -1);
    const L = deg(club.loft + (club.dyn || 0));
    let n = V3.norm([0, 0, 0], [f0[0] * Math.cos(L) + upW[0] * Math.sin(L), f0[1] * Math.cos(L) + upW[1] * Math.sin(L), f0[2] * Math.cos(L) + upW[2] * Math.sin(L)]);
    // thin / topped contact: face edge, ball driven downward
    let quality = 1;
    if (vertOff > 0.55) { n = V3.norm(n, V3.madd([0, 0, 0], n, upW, -0.9 * smoothstep(0.55, 1.2, vertOff))); quality *= lerp(1, 0.55, smoothstep(0.55, 1.2, vertOff)); }
    const vn = V3.dot(headVel, n);
    if (vn <= 0.05) return null;
    const isWood = club.type === 'wood', isPutt = club.type === 'putter';
    const I = isWood ? 4.6e-4 : isPutt ? 4.5e-4 : 2.6e-4;
    const M = club.mass; const d = offCenter;
    const Meff = M / (1 + M * d * d / I);
    let e = club.cor * (1 - 0.0018 * Math.max(vn - 20, 0)) - Math.abs(d) * (isWood ? 1.2 : 2.2);
    e = clamp(e, 0.45, 0.86);
    if (isPutt) e = clamp(club.cor - Math.abs(d) * 2, 0.45, club.cor);
    const un = vn * (1 + e) * Meff / (Meff + PHYS.M) * quality;
    const vt = V3.madd([0, 0, 0], headVel, n, -vn);
    const ut = V3.scale([0, 0, 0], vt, 2 / 7);
    const ball = V3.madd([0, 0, 0], ut, n, un);
    const spin = V3.scale([0, 0, 0], V3.cross([0, 0, 0], ut, n), 5 / (2 * PHYS.R));
    // gear effect: toe hits hook (woods mostly)
    const gear = isWood ? 110 : isPutt ? 0 : 35;
    const axis = V3.norm([0, 0, 0], V3.cross([0, 0, 0], soleW, n)); // ~ vertical-ish axis on the face
    V3.madd(spin, spin, axis, d * gear * vn); // toe (+d) -> hook / draw spin
    // lie
    let sf = lie[0], wf = lie[1];
    if (opts.sandLie && (club.id === 'sw' || club.id === 'pw')) { sf = 0.82; wf = 0.7; }
    if (opts.fat) { sf *= 0.62; wf *= 0.6; }
    V3.scale(ball, ball, sf); V3.scale(spin, spin, wf);
    const bs = V3.len(ball);
    const launch = Math.asin(clamp(ball[1] / (bs || 1), -1, 1)) * 180 / PI;
    return { v: ball, w: spin, ballSpeed: bs, headSpeed: V3.len(headVel), smash: bs / Math.max(V3.len(headVel), 0.01), launch, rpm: V3.len(spin) * 60 / TAU, offCenter: d, quality };
  },
};

'use strict';
// ============================================================================
// THE CLUB — a real interactive VR object.
//  * Grab with GRIP near the handle, release to drop / throw it; it falls,
//    bounces and lies on the ground (2-point rigid body with ground contact).
//  * While held it follows the controller 1:1 (grip space) — no smoothing lag.
//  * Swing detection: continuous (swept) collision of the club-head capsule
//    against the ball with sub-frame interpolation -> no tunnelling even at
//    50 m/s head speed. Head velocity from XR pose velocities when available,
//    else finite differences. Contact point, face angle, loft, path, speed and
//    ground contact (fat shots) all feed the impact model.
// ============================================================================

  }
  get club() { return CLUBS[this.index]; }
  localMatrix() {

    this.game.onClubChanged && this.game.onClubChanged();

  // place club lying on the ground near a position

  update(dt, input) {

'use strict';
// ============================================================================
// Input (WebXR controllers + desktop fallback) and the player rig:
// smooth locomotion, snap/smooth turn, parabolic teleport, terrain following,
// comfort vignette, "go to ball" address positioning.
// ============================================================================

class Btn {
  constructor() { this.down = false; this.pressed = false; this.released = false; this.value = 0; }
  set(v, thr = 0.5) { const d = v > thr; this.pressed = d && !this.down; this.released = !d && this.down; this.down = d; this.value = v; }
}
class Hand {
  constructor(hand) {
    this.hand = hand; this.present = false; this.grip = M4.new(); this.pos = [0, 0, 0]; this.rayO = [0, 0, 0]; this.rayD = [0, 0, -1];
    this.trigger = new Btn(); this.squeeze = new Btn(); this.stick = new Btn(); this.a = new Btn(); this.b = new Btn(); this.axes = [0, 0];
    this.vel = [0, 0, 0]; this.angVel = [0, 0, 0]; this.hasVel = false; this.prevPos = null; this.gamepad = null;
  }
}

class Input {

      const pose = frame.getPose(src.gripSpace, refSpace); if (!pose) continue;

class Player {

  }

  setHead(viewerMatrix) {

}

// Mouse look + WASD; right hand = club controlled by mouse swing (hold LMB, drag).
class DesktopControls {
  constructor(game, canvas) {
    this.game = game; this.canvas = canvas; this.yaw = 0; this.pitch = -0.15; this.swing = 0; this.swingV = 0; this.aimYaw = 0; this.height = 1.68;
    const inp = game.input; this.inp = inp;
    window.addEventListener('keydown', e => { inp.keys[e.code] = true; if (e.code === 'Escape') game.togglePause(); });
    window.addEventListener('keyup', e => { inp.keys[e.code] = false; });
    canvas.addEventListener('mousedown', e => {
      inp.mouse.x = e.clientX; inp.mouse.y = e.clientY;
      if (e.button === 0) { inp.mouse.down = true; inp.mouse.clicked = true; }
      if (e.button === 2 && document.pointerLockElement !== canvas) canvas.requestPointerLock && canvas.requestPointerLock();
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('mouseup', e => { if (e.button === 0) inp.mouse.down = false; });
    window.addEventListener('mousemove', e => { inp.mouse.x = e.clientX; inp.mouse.y = e.clientY; inp.mouse.dx += e.movementX || 0; inp.mouse.dy += e.movementY || 0; });
  }
  update(dt) {
    const g = this.game, inp = this.inp, k = inp.keys, m = inp.mouse; const P = g.player;
    const locked = document.pointerLockElement === this.canvas;
    if (locked || k.KeyQ || k.KeyE) { this.yaw -= m.dx * 0.0025 * (locked ? 1 : 0) + (k.KeyQ ? 1.6 * dt : 0) - (k.KeyE ? 1.6 * dt : 0); if (locked) this.pitch = clamp(this.pitch - m.dy * 0.0022, -1.3, 1.2); }
    // move
    let mx = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0), mz = (k.KeyS ? 1 : 0) - (k.KeyW ? 1 : 0);
    if ((mx || mz) && g.course && (g.state === 'playing' || g.state === 'menu')) {
      const sp = (g.settings.walkSpeed || 2.5) * (k.ShiftLeft ? 3 : 1) * dt; const c = Math.cos(this.yaw), s = Math.sin(this.yaw);
      const nx = P.pos[0] + (c * mx + s * mz) * sp, nz = P.pos[2] + (-s * mx + c * mz) * sp;
      if (P.walkable(nx, nz)) { P.pos[0] = nx; P.pos[2] = nz; }
    }
    P.yaw = 0; // rig yaw unused on desktop; camera yaw is in the head matrix
    if (g.course) { const th = g.course.height(P.pos[0], P.pos[2]); P.smoothY = P.smoothY === null ? th : P.smoothY + (th - P.smoothY) * Math.min(1, dt * 10); P.pos[1] = P.smoothY; }
    P.updateRig();
    // head matrix
    const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp2 = Math.sin(this.pitch);
    const fwd = [-sy * cp, sp2, -cy * cp]; const right = [cy, 0, -sy]; const up = V3.cross([0, 0, 0], right, fwd);
    const eye = [0, this.height, 0];
    const view = M4.fromBasis(M4.new(), eye, right, up, [-fwd[0], -fwd[1], -fwd[2]], 1);
    P.setHead(view);
    // ---- virtual right hand holding the club: swing in the plane of the aim direction
    const H = inp.hands.right; H.present = true; const L = inp.hands.left; L.present = true;
    const swinging = m.down && g.state === 'playing' && !g.uiCapturingMouse;
    if (swinging) { this.swingV = -m.dy * 0.012 / Math.max(dt, 1e-3); this.swing = clamp(this.swing + m.dy * 0.012, -2.6, 2.0); }
    else { this.swing *= Math.exp(-dt * 6); this.swingV = 0; }
    m.dx = 0; m.dy = 0;
    // shoulder pivot in front of the player; the club rotates around an axis perpendicular to the target line
    const aim = this.aimYaw; const ca = Math.cos(aim), sa = Math.sin(aim);
    const tgt = [-sa, 0, -ca];                       // target direction
    const toBall = [ca, 0, -sa];                     // golfer faces the ball (target is to the left)
    const pivot = [P.pos[0], P.pos[1] + 1.25, P.pos[2]];
    const planeTilt = 0.62; const down = V3.norm([0, 0, 0], [toBall[0] * planeTilt, -1, toBall[2] * planeTilt]);
    const gripAt = (a, off) => {
      const dir = V3.norm([0, 0, 0], [down[0] * Math.cos(a) + tgt[0] * Math.sin(a), down[1] * Math.cos(a), down[2] * Math.cos(a) + tgt[2] * Math.sin(a)]);

      const zAxis = V3.scale([0, 0, 0], dir, -1);
      let faceN = V3.norm([0, 0, 0], V3.madd([0, 0, 0], tgt, dir, -V3.dot(tgt, dir))); if (V3.len(faceN) < 0.1) faceN = tgt.slice();

      return { m: M4.fromBasis(M4.new(), handPos, xAxis, yAxis, zAxis, 1), handPos };
    };

    let off = [0, 0, 0];
    const ball = g.ball; const clubs = g.clubs;
    if (ball && V3.distXZ(ball.p, P.pos) < 2.5) {
      const g0 = gripAt(0, off).m; const head0 = M4.transformPoint([0, 0, 0], M4.mul(M4.new(), g0, clubs.localMatrix()), clubs.club.col.sweet);
      off = [ball.p[0] - tgt[0] * 0.035 - head0[0], ball.p[1] - head0[1] + (clubs.club.type === 'putter' ? 0.004 : -0.003), ball.p[2] - tgt[2] * 0.035 - head0[2]];
    }
    const a = this.swing;                            // 0 = address, negative = backswing
    const G = gripAt(a, off); M4.copy(H.grip, G.m); const handPos = G.handPos;
    if (H.prevPos) V3.scale(H.vel, V3.sub([0, 0, 0], handPos, H.prevPos), 1 / Math.max(dt, 1e-3)); H.prevPos = handPos.slice(); H.pos = handPos; H.hasVel = false;
    V3.copy(H.rayO, P.headPos); V3.copy(H.rayD, P.headFwd);
    M4.fromBasis(L.grip, V3.madd([0, 0, 0], P.headPos, [0, -0.45, 0], 1), right, up, [-fwd[0], -fwd[1], -fwd[2]], 1); L.pos = M4.getPos([0, 0, 0], L.grip);
    // buttons
    H.b.set(k.KeyB ? 1 : 0); L.a.set(k.KeyF ? 1 : 0); H.a.set(k.KeyC ? 1 : 0); L.b.set(k.KeyP ? 1 : 0);
    H.trigger.set(m.clicked ? 1 : 0); m.clicked = false;
    for (let i = 1; i <= 9; i++) if (k['Digit' + i]) { if (g.clubs.index !== i - 1) g.clubs.setClub(i - 1); }
  }
}

'use strict';
// ============================================================================
// Game: state machine, modes, golf scoring, hole flow, menus, HUD, settings.
// ============================================================================

const DEFAULT_SETTINGS = {
  lang: 'en', handed: 'right', autoClub: true, aimLine: true, trail: true, pinMarker: true, assist: 0, clubAngle: 0, units: 'm',
  locomotion: 'both', walkSpeed: 2.5, turn: 'snap', snapAngle: 30, vignette: true, heightOffset: 0, seated: false,
  quality: 'med', shadows: 'med', grass: 'med', refresh: 72, foveation: 1, resScale: 1.0,
  master: 0.9, sfx: 1.0, amb: 0.7, ui: 0.7, map: 0, time: 'default', mode: 'stroke',
};
const QUALITY_PRESETS = { low: { shadows: 'low', grass: 'low', foveation: 1, resScale: 0.9, refresh: 72 }, med: { shadows: 'med', grass: 'med', foveation: 1, resScale: 1.0, refresh: 72 }, high: { shadows: 'high', grass: 'high', foveation: 0.5, resScale: 1.1, refresh: 72 } };

function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem('futon_golf_' + key)); localStorage.setItem('futon_golf_' + key, JSON.stringify(val)); } catch (e) { return null; } }

class Game {
  constructor(glx, P, canvas) {
    this.glx = glx; this.P = P; this.canvas = canvas;
    this.settings = Object.assign({}, DEFAULT_SETTINGS, store('settings') || {});
    LANG = this.settings.lang;
    this.input = new Input(); this.player = new Player(this); this.clubs = new ClubSystem(this);
    this.ui = new UIManager(glx); this.ui.onHaptic = (h, i, d) => this.haptic(h, i, d);
    this.state = 'boot'; this.time = 0; this.course = null; this.world = null; this.ball = null;
    this.menuPage = 'main'; this.settingsTab = 0; this.desktop = false; this.toasts = [];
    this.round = null; this.holeIndex = 0; this.strokes = 0; this.bestScores = store('best') || {};
    this.ballGlow = 0; this.prevLie = null; this.pendingDrop = null; this.shotInfo = null;
    this.flagIn = true; this.flagAnim = 1; this.loadingProgress = 0; this.loadingLabel = '';
    this.makePanels();
  }

  // ------------------------------------------------------------------ panels
  makePanels() {
    const ui = this.ui;
    this.menuPanel = ui.add(new Panel(ui, 'menu', 1600, 1000, 1.5, {}));
    this.toastPanel = ui.add(new Panel(ui, 'toast', 1100, 300, 0.95, { interactive: false }));
    this.wristPanel = ui.add(new Panel(ui, 'wrist', 560, 340, 0.155, { interactive: false, mip: true }));
    this.signPanel = ui.add(new Panel(ui, 'sign', 900, 620, 0.88, { interactive: false }));
    this.pinPanel = ui.add(new Panel(ui, 'pin', 320, 160, 1.0, { interactive: false }));
    this.loadPanel = ui.add(new Panel(ui, 'load', 1600, 900, 2.4, { interactive: false, always: true }));
    this.hintPanel = ui.add(new Panel(ui, 'hint', 1200, 110, 0.9, { interactive: false }));
    this.menuPanel.overlay = true; this.toastPanel.overlay = true; this.loadPanel.overlay = true; this.hintPanel.overlay = true;
  }
  saveSettings() { store('settings', this.settings); }
  set(k, v) {
    this.settings[k] = v;
    if (k === 'lang') LANG = v;
    if (k === 'quality') Object.assign(this.settings, QUALITY_PRESETS[v]);
    if (['shadows', 'quality'].includes(k) && this.world) this.world.setShadowQuality(this.settings.shadows);
    if (['master', 'sfx', 'amb', 'ui'].includes(k)) AUDIO.setVolumes({ master: this.settings.master, sfx: this.settings.sfx, amb: this.settings.amb, ui: this.settings.ui });
    if (['refresh', 'foveation', 'quality'].includes(k)) this.applyXRSettings && this.applyXRSettings();
    this.saveSettings(); this.menuPanel.dirty = true; this.wristDirty = true;
  }
  haptic(hand, intensity, ms) {
    if (!hand) return; const H = this.input.hands[hand]; const gp = H && H.gamepad;
    if (gp && gp.hapticActuators && gp.hapticActuators[0]) { try { gp.hapticActuators[0].pulse(clamp(intensity, 0, 1), ms); } catch (e) { } }
  }
  uiCapturing(hand) { return this.menuPanel.visible && this.menuPanel.targetOpacity > 0; }
  toast(title, sub, dur = 2.4, color) { this.toastData = { title, sub, color, t: 0, dur }; this.toastPanel.setPage((ctx, P) => this.drawToast(ctx, P)); this.toastPanel.show(); this.toastFollow = null; }

  // ------------------------------------------------------------------ course loading
  async loadCourse(mapIndex, timeKey, purpose) {
    const def = MAPS[mapIndex];
    this.state = 'loading'; this.loadingProgress = 0; this.loadingLabel = T('load_terrain'); this.loadMapName = T(def.key);
    this.menuPanel.hide(); this.signPanel.hide(); this.pinPanel.hide(); this.wristPanel.hide(); this.hole = null;
    this.loadPanel.setPage((ctx, P) => this.drawLoading(ctx, P)); this.loadPanel.show();
    this.player.fadeTarget = 0;
    if (this.world) this.disposeWorld();
    await sleep(60);
    const time = (timeKey && timeKey !== 'default') ? timeKey : def.defaultTime;
    const course = new Course(def, { time });
    const prog = (p, label) => { this.loadingProgress = p; if (label) this.loadingLabel = T(label); else this.loadingLabel = p < 0.4 ? T('load_terrain') : p < 0.72 ? T('load_surface') : T('load_meshes'); };
    await course.generate(prog);
    const world = new World(this.glx, this.P, course, this.settings);
    await world.build(prog);
    this.course = course; this.world = world; this.mapIndex = mapIndex;
    this.ball = new BallPhysics(course); this.ball.treeDims = world.treeDims;
    AUDIO.startAmbience(def.ambience, course);

  // ------------------------------------------------------------------ menu flow
  async enterMenu(page = 'main') {
    if (!this.course) await this.loadCourse(this.settings.map || 0, this.settings.time, 'menu');
    this.state = 'menu'; this.menuPage = page; this.round = null;

    const line = []; for (let i = 0; i <= 20; i++) { const x = b[0] + d[0] * L * i / 20, z = b[2] + d[2] * L * i / 20; line.push([x, game.course.height(x, z) + 0.004, z]); }
    const cnt = world.buildRibbon(line, [b[0], b[1] + 50, b[2]], () => 0.006, world.arcPos, world.arcCol, t => [255, 255, 255, Math.round(120 * (1 - t))]);
    glx.updateDyn(world.arcMesh, world.arcPos, null, world.arcCol, cnt); gl.uniformMatrix4fv(p.u.u_model, false, M4.identity(m)); gl.uniform4f(p.u.u_color, 1, 1, 1, 1); glx.draw(world.arcMesh);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
}

function drawPanels(vp, cp, noWorld) {
  const game = APP.game, gl = APP.gl, glx = APP.glx, P = APP.P;
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  const p = glx.use(P.ui); gl.uniformMatrix4fv(p.u.u_viewProj, false, vp);
  for (const pass of [false, true]) {
    if (pass) gl.disable(gl.DEPTH_TEST); else gl.enable(gl.DEPTH_TEST);
    for (const panel of game.ui.panels) {
      if (!panel.visible || !panel.tex || !!panel.overlay !== pass) continue;
      if (noWorld && !panel.overlay) continue;
      gl.uniformMatrix4fv(p.u.u_model, false, panel.matrix); gl.uniform1f(p.u.u_opacity, panel.opacity); glx.tex(p, 'u_tex', panel.tex); glx.draw(panel.mesh);
    }
  }
  // laser pointers
  const u = glx.use(P.unlit); gl.uniformMatrix4fv(u.u.u_viewProj, false, vp);
  for (const hand of ['left', 'right']) {
    const ptr = game.ui.pointers[hand]; if (!ptr || game.desktop) continue;
    const z = V3.scale([0, 0, 0], ptr.dir, -1); const x = V3.norm([0, 0, 0], V3.cross([0, 0, 0], [0, 1, 0], z)); const y = V3.cross([0, 0, 0], z, x);
    const m = M4.fromBasis(M4.new(), ptr.origin, x, y, z, 1); m[8] *= ptr.t; m[9] *= ptr.t; m[10] *= ptr.t;
    gl.uniformMatrix4fv(u.u.u_model, false, m); gl.uniform4f(u.u.u_color, 1, 1, 1, 0.9); glx.draw(game.ui.beam);
  }
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
}

function drawOverlays(vp, cp, camMat) {
  const game = APP.game, gl = APP.gl, glx = APP.glx, P = APP.P; const pl = game.player;
  const world = game.world; if (!world && pl.fade < 0.01) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  const u = glx.use(P.unlit); gl.uniformMatrix4fv(u.u.u_viewProj, false, vp);
  if (world && pl.vignette > 0.02 && !game.desktop) { gl.uniformMatrix4fv(u.u.u_model, false, camMat); gl.uniform4f(u.u.u_color, 1, 1, 1, pl.vignette); glx.draw(world.vignetteMesh); }
  if (world && pl.fade > 0.01) { const m = M4.copy(M4.new(), camMat); for (const i of [0, 1, 2, 4, 5, 6, 8, 9, 10]) m[i] *= 0.5; gl.uniformMatrix4fv(u.u.u_model, false, m); gl.uniform4f(u.u.u_color, 1, 1, 1, pl.fade); glx.draw(world.fadeMesh); }
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
}

// ball visual rotation integrates its spin vector each frame
function updateBallRot(dt) {
  const b = APP.game.ball; if (!b || !b.moving) return;
  const w = b.w; const wl = V3.len(w); if (wl < 0.01) return;
  const r = M4.rotAxis(M4.new(), [w[0] / wl, w[1] / wl, w[2] / wl], wl * dt);
  M4.mul(APP.ballRot, r, APP.ballRot); APP.ballRot[12] = APP.ballRot[13] = APP.ballRot[14] = 0;
}
const _gameUpdate = Game.prototype.update;
Game.prototype.update = function (dt) { _gameUpdate.call(this, dt); updateBallRot(dt); };

// ------------------------------------------------------------------ landing page (2D)
function showLanding() {
  document.getElementById('landing').style.display = 'flex'; document.getElementById('help').style.display = 'none';
  APP.landingT = performance.now(); requestAnimationFrame(drawLandingLogo);
  refreshLandingText();
}
function hideLanding() { document.getElementById('landing').style.display = 'none'; }
function refreshLandingText() {
  document.getElementById('btn-vr').textContent = T('enter_vr');
  document.getElementById('btn-desktop').textContent = T('play_desktop');
  document.getElementById('dev').textContent = T('developed_by');
  document.getElementById('lang-toggle').textContent = LANG === 'en' ? 'RU' : 'EN';
  const note = document.getElementById('note'); note.textContent = APP.vrSupported ? T('vr_hint') : T('vr_unsupported');
  document.getElementById('btn-vr').style.display = APP.vrSupported ? 'block' : 'none';
}
function drawLandingLogo() {
  const el = document.getElementById('landing'); if (el.style.display === 'none') return;
  const c = document.getElementById('logo'); const ctx = c.getContext('2d'); const dpr = Math.min(devicePixelRatio, 2);
  const w = c.clientWidth * dpr, h = c.clientHeight * dpr; if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  ctx.clearRect(0, 0, w, h); const t = (performance.now() - APP.landingT) / 1000; const s = Math.min(w / 900, h / 420);
  drawFutonLogo(ctx, w / 2 + 40 * s, h * 0.3, 92 * s, clamp(t / 1.5, 0, 1));
  ctx.globalAlpha = clamp((t - 1.2) / 0.8, 0, 1); drawGameTitle(ctx, w / 2, h * 0.72, 84 * s, 1); ctx.globalAlpha = 1;
  if (t < 4) requestAnimationFrame(drawLandingLogo);
}

async function main() {
  try { initGL(); } catch (e) { document.getElementById('note').textContent = 'WebGL2 error: ' + e.message; console.error(e); return; }
  APP.vrSupported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr').catch(() => false));
  document.getElementById('btn-vr').onclick = () => startXR().catch(e => { console.error(e); alert('VR: ' + e.message); });
  document.getElementById('btn-desktop').onclick = () => startDesktop();
  document.getElementById('lang-toggle').onclick = () => { APP.game.set('lang', LANG === 'en' ? 'ru' : 'en'); refreshLandingText(); };
  showLanding();
  // Installed Meta Quest PWA (immersive package): launch straight into VR like a native app
  const installed = 'getDigitalGoodsService' in window || window.matchMedia('(display-mode: standalone)').matches;
  if (APP.vrSupported && (installed || /[?&]autoxr=1/.test(location.search))) {
    if (navigator.xr.addEventListener) navigator.xr.addEventListener('sessiongranted', () => { if (!APP.xr) startXR().catch(console.error); });
    setTimeout(() => { if (!APP.xr) startXR().catch(e => console.warn('auto XR needs a click:', e.message)); }, 250);
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}

// ------------------------------------------------------------------ test / debug API
window.FG = {
  APP,
  util: { inv: a => M4.invert(M4.new(), a), mul: (a, b) => M4.mul(M4.new(), a, b), cross: (a, b) => V3.cross([0, 0, 0], a, b), norm: a => V3.norm([0, 0, 0], a), rot: (ax, a) => M4.rotAxis(M4.new(), ax, a), tdir: (m, v) => M4.transformDir([0, 0, 0], m, v), tp: (m, v) => M4.transformPoint([0, 0, 0], m, v) },
  get game() { return APP.game; },
  async desktop() { startDesktop(); },
  step(dt = 1 / 60, n = 1) { for (let i = 0; i < n; i++) desktopStep(dt); },
  async waitState(s, ms = 60000) { const t0 = performance.now(); while (APP.game.state !== s && performance.now() - t0 < ms) await sleep(50); return APP.game.state; },
  view(pos, yaw, pitch) { const d = APP.game.desktopCtl; const P = APP.game.player; P.pos[0] = pos[0]; P.pos[2] = pos[2]; P.smoothY = null; if (pos[1] !== undefined) d.height = pos[1]; d.yaw = yaw; d.pitch = pitch; },
  // simulate a real club impact through the full impact model
  shot(clubIdx, headSpeed, attackDeg = -3, pathDeg = 0, faceDeg = 0) {
    const g = APP.game; const b = g.ball; const club = CLUBS[clubIdx]; g.clubs.setClub(clubIdx, true);
    const tgt = g.aimTarget(); const t = V3.norm([0, 0, 0], [tgt[0] - b.p[0], 0, tgt[2] - b.p[2]]); const yaw0 = Math.atan2(t[0], t[2]);
    const a = deg(attackDeg), p = yaw0 + deg(pathDeg), f = yaw0 + deg(faceDeg);
    const v = [Math.sin(p) * Math.cos(a) * headSpeed, Math.sin(a) * headSpeed, Math.cos(p) * Math.cos(a) * headSpeed];
    const face0 = [Math.sin(f), 0, Math.cos(f)], sole = [Math.cos(f), 0, -Math.sin(f)];
    const surf = g.course.surface(b.p[0], b.p[2]); const lie = b.teeHeight > 0 ? [1, 1] : SURF_PHYS[surf].lie;
    const res = ClubImpact.compute(club, v, face0, [0, 1, 0], sole, 0, 0, lie, {});
    g.onImpact(res, b.p, surf, false); AUDIO.impact(club.type === 'putter' ? 'putter' : club.type === 'wood' ? 'wood' : 'iron', 0.8, b.p);
    return res;
  },
  simulateUntilRest(maxS = 40) { const g = APP.game; let t = 0; while (g.ball.moving && t < maxS) { g.update(1 / 60); t += 1 / 60; } return { t, state: g.ball.state, pos: g.ball.p.slice() }; },
};

window.addEventListener('load', main);

})();
</script>
