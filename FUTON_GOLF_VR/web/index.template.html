<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FUTON GOLF VR — FUTON GROUP</title>
<meta name="description" content="FUTON GOLF VR — a virtual reality golf game for Meta Quest by FUTON GROUP.">
<meta name="theme-color" content="#0b0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #07090b; overflow: hidden; font-family: "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; color: #f4f6f5; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #landing { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(1200px 700px at 50% 35%, #17222a 0%, #0b1014 55%, #050708 100%); z-index: 10; }
  #landing::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 300px at 50% 105%, rgba(255,106,61,0.18), rgba(255,106,61,0) 70%); }
  #logo { width: min(900px, 92vw); height: min(420px, 44vw); }
  .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; z-index: 1; }
  button.big { font: 700 20px/1 inherit; font-family: inherit; letter-spacing: 3px; padding: 22px 46px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #f4f6f5; cursor: pointer; transition: transform .2s, background .2s, box-shadow .2s; }
  button.big:hover { transform: translateY(-2px) scale(1.02); background: rgba(255,255,255,0.12); }
  button.primary { background: linear-gradient(90deg, #FF6A3D, #FFB547); border: none; box-shadow: 0 10px 40px rgba(255,106,61,0.35); }
  button.primary:hover { box-shadow: 0 14px 50px rgba(255,106,61,0.55); background: linear-gradient(90deg, #FF7A4D, #FFC060); }
  #note { color: rgba(244,246,245,0.6); font-size: 15px; max-width: 640px; text-align: center; z-index: 1; }
  #dev { position: absolute; bottom: 26px; color: rgba(244,246,245,0.4); letter-spacing: 4px; font-size: 13px; text-transform: uppercase; }
  #lang-toggle { position: absolute; top: 22px; right: 26px; font: 600 14px inherit; font-family: inherit; letter-spacing: 2px; background: rgba(255,255,255,0.06); color: #fff;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 9px 16px; cursor: pointer; z-index: 2; }
  #help { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(8,12,16,0.7); padding: 10px 18px; border-radius: 20px; font-size: 13px; color: rgba(255,255,255,0.75); display: none; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="landing">
  <button id="lang-toggle">RU</button>
  <canvas id="logo"></canvas>
  <div class="btns">
    <button id="btn-vr" class="big primary">ENTER VR</button>
    <button id="btn-desktop" class="big">PLAY ON DESKTOP</button>
  </div>
  <div id="note"></div>
  <div id="dev">Developed by FUTON GROUP</div>
</div>
<div id="help"></div>
<script>
/*__GAME_JS__*/
</script>
</body>
</html>
